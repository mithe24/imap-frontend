[package]
name = "map-engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4" # run async 
gloo-net = "0.6" # for HTTP call
serde = { version = "1", features = ["derive"] } # deserialzartion of Overpass response
serde_json = "1"
wgpu = "30.0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "EventTarget",
  "HtmlElement", "Node",
  "HtmlCanvasElement", "WebGlRenderingContext", "WebGlProgram",
  "WebGlShader", "WebGlBuffer", "WebGlUniformLocation",
  "WheelEvent", "MouseEvent", "Event", "EventTarget",
  "DomRect", "console"
]
