<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
    </head>
    <body>
        <button id="btn">Click me</button>
        <p id="count">Clicked 0 times</p>

        <hr />

        <label>
            Click it
            <input id="n" type="number" value="5" min="1" style="width: 4em" />
            times
        </label>
        <button id="auto">Go</button>

        <script type="module">
            import init, { click_n_times } from "./pkg/map_engine.js";

          await init(); // loads the .wasm and runs start()

          document.getElementById("auto").addEventListener("click", () => {
              const n = Number(document.getElementById("n").value);
              click_n_times(n);
          });
        </script>
    </body>
</html>
